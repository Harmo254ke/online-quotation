<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script type="module" src="./src/index.js"></script>
  <title>Simple CSV Loader</title>
</head>

<body class="bg-body-secondary text-body">
  <div class="container py-4">
    <div class="row mb-3 align-items-center">
      <div class="col-md-4 mb-2 mb-md-0"> <select id="search-type" class="form-select">
          <option value="name" selected>Product Name</option>
          <option value="category">Category</option>
        </select> </div>
      <div class="col-md-8">
        <div class="input-group"> <input id="search-input" type="text" class="form-control"
            placeholder="Search products..." aria-label="Search products" /> <button class="btn btn-primary"
            id="search-btn" type="button">Search</button> </div>
      </div>
    </div>


    <div class="container-fluid">
      <div class="row">
        <!-- Table Section -->
        <div class="col-12 col-lg-8 mb-3">
          <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>No</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Unit</th>
                  <th>Price</th>
                </tr>
              </thead>
              <tbody id="quotation-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Order Preview Section -->
        <div class="col-12 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header bg-light fw-semibold">Order Preview</div>
            <div class="card-body" id="order-preview">
              ORDER PREVIEW WILL BE HERE
            </div>
          </div>
        </div>
      </div>
    </div>
    <nav>
      <ul id="pagination" class="pagination justify-content-center mt-3"></ul>
    </nav>
  </div>
</body>

</html>
