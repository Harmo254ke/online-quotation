<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- html2canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script type="module" src="./src/index.js"></script>
  <link rel="stylesheet" href="./src/styles/table.css" />
  <link rel="stylesheet" href="./src/styles/index.css" />
  <title>Simple CSV Loader</title>
</head>

<body class="bg-body-secondary text-body page-contents">
  <div class="container-fluid py-4 ">


    <div class="container-fluid">
      <div class="row">
        <!-- Table Section -->
        <div class="col-12 col-lg-6 mb-3 quotation-table-section">
          <div class="row mb-3 align-items-center">
            <div class="col-md-4 mb-2 mb-md-0"> <select id="search-type" class="form-select">
                <option value="name" selected>Product Name</option>
                <option value="category">Category</option>
              </select> </div>
            <div class="col-md-8">
              <div class="input-group"> <input id="search-input" type="text" class="form-control"
                  placeholder="Search products..." aria-label="Search products" /> <button class="btn btn-primary"
                  id="search-btn" type="button">Search</button> </div>
            </div>
          </div>

          <div class="table-responsive items">
            <table class="table table-striped table-bordered align-middle mb-0">
              <colgroup>
                <col style="width: 5%;">
                <col style="width: 30%;">
                <col style="width: 25%;">
                <col style="width: 15%;">
                <col style="width: 15%;">
                <col style="width: 10%;">
              </colgroup>
              <thead class="table-light">
                <tr>
                  <th></th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Unit</th>
                  <th>Price</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="quotation-body" class="small"></tbody>
            </table>
          </div>
          <nav>
            <ul id="pagination" class="pagination justify-content-center mt-3"></ul>
          </nav>
        </div>

        <!-- Order Preview Section -->
        <div class="col-12 col-lg-6 order-preview-section">
          <div class="card shadow-sm">
            <div class="card-header bg-light fw-semibold not-print">Order Preview</div>
            <div class="card-body printable-container order-preview" id="order-preview">
              No order items added
            </div>
            <div class="card-footer d-flex  justify-content-between align-items-center bg-light"
              id="totals-print-button">
              <div class="fw-semibold totals">
                Total order value : <span id="order-total" class="text-success">KSh 0.00</span>
              </div>
              <button id="print-order-btn" class="btn btn-primary btn-sm">
                <i class="bi bi-printer"></i> go to print page </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
