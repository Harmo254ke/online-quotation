<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- html2canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script type="module" src="./index.js"></script>
  <link rel="stylesheet" href="./styles/table.css" />
  <link rel="stylesheet" href="./styles/index.css" />
  <title>Online quotation</title>
</head>

<body class="bg-body-secondary text-body page-contents">
  <!-- 🧾 App Header -->
  <header class="bg-white shadow-sm py-2 border-bottom position-sticky top-0 z-3">
    <div class="container-fluid d-flex justify-content-center align-items-center position-relative">
      <!-- Centered App Name -->
      <h5 class="m-0 fw-bold text-success text-uppercase">Quotation</h5>

      <!-- Logo on Right -->
      <img src="./assets/logo.png" alt="App Logo" class="position-absolute end-0 me-3"
        style="height: 40px; width: auto;" />
    </div>
  </header>
  <div class="container-fluid py-2 ">
    <div class="container-fluid">
      <div class="row">
        <!-- Table Section -->
        <div class="col-12 col-lg-6 mb-3 quotation-table-section">
          <div class="row mb-3 align-items-center">
            <div class="col-md-4 mb-2 mb-md-0"> <select id="search-type" class="form-select">
                <option value="name" selected>Product Name</option>
                <option value="category">Category</option>
              </select> </div>
            <div class="col-md-8">
              <div class="input-group"> <input id="search-input" type="text" class="form-control"
                  placeholder="Search products..." aria-label="Search products" /> <button class="btn btn-primary"
                  id="search-btn" type="button">Search</button> </div>
            </div>
          </div>
          <div class="d-flex justify-content-end mb-2">
            <button id="refresh-btn" class="btn btn-outline-success btn-sm">
              <i class="bi bi-arrow-clockwise"></i> Refresh Table
            </button>
          </div>
          <div class="table-responsive items">
            <table class="table table-striped table-bordered align-middle mb-0">
              <colgroup>
                <col style="width: 5%;">
                <col style="width: 30%;">
                <col style="width: 25%;">
                <col style="width: 15%;">
                <col style="width: 15%;">
                <col style="width: 10%;">
              </colgroup>
              <thead class="table-light">
                <tr>
                  <th></th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Unit</th>
                  <th>Price</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="quotation-body"></tbody>
            </table>
          </div>
          <nav>
            <ul id="pagination" class="pagination justify-content-center mt-3"></ul>
          </nav>
        </div>

        <!-- Order Preview Section -->
        <div class="col-12 col-lg-6 order-preview-section">
          <div class="card shadow-sm">
            <div class="card-header bg-light fw-semibold not-print">Order Preview</div>
            <div class="card-body printable-container order-preview" id="order-preview">
              No order items added
            </div>

            <div class="card-footer d-flex justify-content-between align-items-center bg-light"
              id="totals-print-button">
              <div class="fw-semibold totals">
                Total order value : <span id="order-total" class="text-success">KSh 0.00</span>
              </div>

              <div class="d-flex gap-2">
                <button id="clear-order-btn" class="btn btn-outline-danger btn-sm">
                  <i class="bi bi-trash"></i> Clear Order
                </button>

                <a href="./printing/printorderform.html" id="print-order-btn" class="btn btn-primary btn-sm">
                  <i class="bi bi-printer"></i> Go to print page
                </a>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>



  <!-- Bootstrap Modal -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderDetailsModalLabel">Order Form Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="orderDetailsForm">
            <h6 class="fw-bold mt-2">School Details</h6>
            <div class="mb-2">
              <label class="form-label">School Name *</label>
              <input type="text" class="form-control" name="schoolName" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Town *</label>
              <input type="text" class="form-control" name="schoolTown" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Contact Info *</label>
              <input type="text" class="form-control" name="schoolContact" required>
            </div>

            <h6 class="fw-bold mt-3">Supplier Details</h6>
            <div class="mb-2">
              <label class="form-label">Supplier Name *</label>
              <input type="text" class="form-control" name="vendorName" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Town</label>
              <input type="text" class="form-control" name="vendorTown">
            </div>
            <div class="mb-2">
              <label class="form-label">Contact Info</label>
              <input type="text" class="form-control" name="vendorContact">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" id="confirmDetailsBtn">Continue</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Item Modal -->
  <div class="modal fade" id="editItemModal" tabindex="-1" aria-labelledby="editItemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editItemModalLabel">Edit Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <!-- Product Name (readonly) -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Product</label>
            <input type="text" id="editProductName" class="form-control" readonly />
          </div>

          <!-- Quantity & Amount Side by Side -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="editQuantity" class="form-label fw-semibold">Quantity</label>
              <input type="number" id="editQuantity" class="form-control" min="1" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Amount (KSh)</label>
              <input type="text" id="editAmount" class="form-control" readonly />
            </div>
          </div>
        </div>

        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="deleteItemBtn" class="btn btn-outline-danger">
            Delete Item
          </button>

          <div>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary me-2" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" id="saveEditBtn" class="btn btn-success">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
